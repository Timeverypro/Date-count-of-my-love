<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Time Counter</title>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #12121a 0%, #050508 70%);
      color: #f0f0f5;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4.5vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Soft pink accent on 1 May */
    body.may1 {
      background: radial-gradient(ellipse at center, #12121a 0%, #050508 70%);
    }
    body.may1::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 100% 0%, rgba(255, 105, 180, 0.18) 0%, transparent 45%),
                  radial-gradient(circle at 0% 100%, rgba(255, 105, 180, 0.12) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7em;
      position: relative;
      z-index: 10;
    }

    .section-title {
      font-size: clamp(13px, 2.8vw, 18px);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.45;
      font-weight: 400;
    }

    .timer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0;
      max-width: 96vw;
      padding: 0 10px;
      text-align: center;
      font-weight: 200;
      letter-spacing: 0.5px;
      line-height: 1.25;
      text-shadow: 0 0 18px rgba(120, 160, 255, 0.35),
                   0 0 40px rgba(80, 120, 255, 0.15);
      animation: softPulse 6s ease-in-out infinite;
    }

    .unit-block {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: 4em;
      padding: 0 0.55em;
    }

    .separator {
      width: 1.5px;
      height: 2.8em;
      background: linear-gradient(to bottom, transparent 0%, rgba(160,190,255,0.45) 20%, rgba(160,190,255,0.45) 80%, transparent 100%);
      margin: 0 0.15em;
      align-self: center;
      opacity: 0.7;
    }

    .number {
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: #e8f0ff;
      font-size: clamp(48px, 12vw, 96px);
    }

    .label {
      font-size: clamp(12px, 2.8vw, 18px);
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-top: 0.15em;
    }

    /* Bottom-right panel */
    .bottom-right {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: rgba(10, 12, 20, 0.85);
      border: 1px solid rgba(160, 190, 255, 0.18);
      border-radius: 14px;
      padding: 14px 16px;
      min-width: 220px;
      max-width: 280px;
      backdrop-filter: blur(10px);
      z-index: 100;
      font-size: 14px;
      line-height: 1.5;
    }

    .bottom-right .days10 {
      font-size: 18px;
      font-weight: 300;
      color: #c8d8ff;
      margin-bottom: 8px;
    }

    .bottom-right .custom-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }

    .bottom-right input[type="number"],
    .bottom-right input[type="email"],
    .bottom-right input[type="password"],
    .bottom-right input[type="url"] {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(160,190,255,0.25);
      border-radius: 6px;
      color: #e8f0ff;
      padding: 6px 8px;
      font-size: 14px;
      width: 100%;
      outline: none;
    }

    .bottom-right input[type="number"] { width: 90px; }

    .bottom-right button {
      background: rgba(100, 140, 255, 0.25);
      border: 1px solid rgba(140, 180, 255, 0.4);
      color: #e0eaff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .bottom-right button:hover { background: rgba(100, 140, 255, 0.4); }

    .bottom-right .auth-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(160,190,255,0.15); }
    .bottom-right .auth-box input { margin-bottom: 6px; }
    .bottom-right .auth-buttons { display: flex; gap: 6px; margin-top: 6px; }
    .bottom-right .status { font-size: 12px; opacity: 0.7; margin-top: 6px; }
    .hidden { display: none !important; }

    /* Pictures */
    #pictures-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .pic-item {
      position: absolute;
      pointer-events: auto;
      transform-origin: center center;
      cursor: grab;
    }
    .pic-item.editing { outline: 2px dashed rgba(255,255,255,0.5); }
    .pic-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      border-radius: 4px;
    }

    .pic-controls {
      position: absolute;
      top: -32px;
      left: 0;
      display: none;
      gap: 4px;
    }
    .pic-item.editing .pic-controls { display: flex; }

    .pic-controls button {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .resize-handle, .rotate-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #7af;
      border: 2px solid white;
      border-radius: 50%;
      display: none;
    }
    .pic-item.editing .resize-handle,
    .pic-item.editing .rotate-handle { display: block; }

    .resize-handle { right: -7px; bottom: -7px; cursor: nwse-resize; }
    .rotate-handle { top: -28px; left: 50%; transform: translateX(-50%); cursor: grab; }

    /* Edit mode bar */
    #edit-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,12,20,0.9);
      border: 1px solid rgba(160,190,255,0.25);
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      gap: 8px;
      align-items: center;
      z-index: 200;
      backdrop-filter: blur(8px);
    }
    #edit-bar input { width: 220px; }

    #pic-btn {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 100;
      display: none;
      background: rgba(100,140,255,0.3);
      border: 1px solid rgba(140,180,255,0.5);
      color: #e0eaff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 20px;
      cursor: pointer;
    }

    @media (orientation: landscape) {
      body { gap: 5.5vh; }
      .number { font-size: clamp(42px, 9vw, 86px); }
      .label { font-size: clamp(11px, 2.2vw, 16px); }
      .separator { height: 2.5em; }
      .section-title { font-size: clamp(12px, 2vw, 16px); }
    }
    @media (orientation: portrait) {
      body { gap: 5vh; }
      .number { font-size: clamp(52px, 13.5vw, 102px); }
      .label { font-size: clamp(13px, 3.2vw, 19px); }
      .separator { height: 3em; }
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.008); }
    }
  </style>
</head>
<body>

  <div class="section">
    <div class="section-title">Since 1 May 2026</div>
    <div class="timer" id="timer2026"></div>
  </div>

  <div class="section">
    <div class="section-title" id="title2035">Until 1 May 2035</div>
    <div class="timer" id="timer2035"></div>
  </div>

  <!-- Pictures layer -->
  <div id="pictures-layer"></div>

  <!-- Edit bar -->
  <div id="edit-bar">
    <input type="url" id="picUrl" placeholder="Paste image URL here">
    <button id="addPicBtn">Add</button>
    <button id="doneBtn">Done</button>
  </div>

  <button id="pic-btn" title="Edit Pictures">🖼️</button>

  <!-- Bottom-right panel -->
  <div class="bottom-right">
    <div class="days10">Days × 10: <span id="days10">—</span></div>
    <div class="custom-row">
      <input type="number" id="customAmount" placeholder="Custom" disabled>
      <button id="saveBtn" disabled>Save</button>
    </div>

    <div class="auth-box" id="authBox">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <div class="auth-buttons">
        <button id="signInBtn">Sign In</button>
        <button id="signUpBtn">Sign Up</button>
      </div>
      <div class="status" id="authStatus"></div>
    </div>

    <div class="auth-box hidden" id="loggedBox">
      <div class="status" id="userEmail"></div>
      <button id="logoutBtn" style="margin-top:6px;width:100%">Log out</button>
    </div>
  </div>

  <script>
    // ========== PASTE YOUR REAL FIREBASE CONFIG HERE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDMKdFTiF4Xk6NqgUK1voRgnVnVO8ECXHY",
      authDomain: "date-count-of-my-love.firebaseapp.com",
      databaseURL: "https://date-count-of-my-love-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "date-count-of-my-love",
      storageBucket: "date-count-of-my-love.firebasestorage.app",
      messagingSenderId: "368211375044",
      appId: "1:368211375044:web:1d785cb73c0965f5442a91",
      measurementId: "G-5NR3W6VMCF"
    };
    // ==========================================================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const START_2026  = new Date('2026-05-01T22:45:00+07:00').getTime();
    const TARGET_2035 = new Date('2035-05-01T22:45:00+07:00').getTime();

    function plural(n, s, p) { return n === 1 ? s : p; }

    function buildHTML(d, h, m, s) {
      return `
        <div class="unit-block"><div class="number">${d}</div><div class="label">${plural(d,'day','days')}</div></div>
        <div class="separator"></div>
        <div class="unit-block"><div class="number">${h}</div><div class="label">${plural(h,'hour','hours')}</div></div>
        <div class="separator"></div>
        <div class="unit-block"><div class="number">${m}</div><div class="label">${plural(m,'minute','minutes')}</div></div>
        <div class="separator"></div>
        <div class="unit-block"><div class="number">${s}</div><div class="label">${plural(s,'second','seconds')}</div></div>
      `;
    }

    function getParts(ms) {
      const total = Math.floor(Math.abs(ms) / 1000);
      return {
        days: Math.floor(total / 86400),
        hours: Math.floor((total % 86400) / 3600),
        minutes: Math.floor((total % 3600) / 60),
        seconds: total % 60
      };
    }

    function isMay1Thai() {
      const str = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' }); // YYYY-MM-DD
      return str.endsWith('-05-01');
    }

    function update() {
      const now = Date.now();

      // May 1 special background
      document.body.classList.toggle('may1', isMay1Thai());

      // 2026
      const e2026 = Math.max(0, now - START_2026);
      const p1 = getParts(e2026);
      document.getElementById('timer2026').innerHTML = buildHTML(p1.days, p1.hours, p1.minutes, p1.seconds);
      document.getElementById('days10').textContent = p1.days * 10;

      // 2035
      const diff = TARGET_2035 - now;
      const p2 = getParts(diff);
      document.getElementById('title2035').textContent = diff > 0 ? 'Until 1 May 2035' : 'Since 1 May 2035';
      document.getElementById('timer2035').innerHTML = buildHTML(p2.days, p2.hours, p2.minutes, p2.seconds);
    }

    update();
    setInterval(update, 1000);

    // ========== Auth + Custom amount ==========
    const customInput = document.getElementById('customAmount');
    const saveBtn = document.getElementById('saveBtn');
    const authBox = document.getElementById('authBox');
    const loggedBox = document.getElementById('loggedBox');
    const authStatus = document.getElementById('authStatus');
    const userEmailEl = document.getElementById('userEmail');
    const picBtn = document.getElementById('pic-btn');

    let currentUid = null;
    let pictures = {};          // id -> data
    let editMode = false;

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUid = user.uid;
        authBox.classList.add('hidden');
        loggedBox.classList.remove('hidden');
        userEmailEl.textContent = user.email;
        customInput.disabled = false;
        saveBtn.disabled = false;
        picBtn.style.display = 'block';

        db.ref('users/' + user.uid + '/customAmount').once('value')
          .then(snap => { if (snap.exists()) customInput.value = snap.val(); });

        loadPictures();
      } else {
        currentUid = null;
        authBox.classList.remove('hidden');
        loggedBox.classList.add('hidden');
        customInput.disabled = true;
        saveBtn.disabled = true;
        customInput.value = '';
        picBtn.style.display = 'none';
        exitEditMode();
        clearPictures();
      }
    });

    document.getElementById('signUpBtn').onclick = () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      authStatus.textContent = 'Creating...';
      auth.createUserWithEmailAndPassword(email, pass)
        .then(() => authStatus.textContent = 'Created!')
        .catch(e => authStatus.textContent = e.message);
    };

    document.getElementById('signInBtn').onclick = () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      authStatus.textContent = 'Signing in...';
      auth.signInWithEmailAndPassword(email, pass)
        .then(() => authStatus.textContent = '')
        .catch(e => authStatus.textContent = e.message);
    };

    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    saveBtn.onclick = () => {
      if (!currentUid) return;
      const val = Number(customInput.value) || 0;
      db.ref('users/' + currentUid + '/customAmount').set(val)
        .then(() => { authStatus.textContent = 'Saved!'; setTimeout(() => authStatus.textContent = '', 1500); })
        .catch(e => authStatus.textContent = e.message);
    };

    // ========== Pictures system ==========
    const layer = document.getElementById('pictures-layer');
    const editBar = document.getElementById('edit-bar');

    function clearPictures() {
      layer.innerHTML = '';
      pictures = {};
    }

    function loadPictures() {
      if (!currentUid) return;
      db.ref('users/' + currentUid + '/pictures').once('value').then(snap => {
        clearPictures();
        const data = snap.val() || {};
        pictures = data;
        Object.keys(data).forEach(id => createPicElement(id, data[id]));
      });
    }

    function savePicture(id) {
      if (!currentUid || !pictures[id]) return;
      db.ref('users/' + currentUid + '/pictures/' + id).set(pictures[id]);
    }

    function createPicElement(id, data) {
      const el = document.createElement('div');
      el.className = 'pic-item';
      el.dataset.id = id;
      el.style.left = (data.x || 50) + 'px';
      el.style.top = (data.y || 50) + 'px';
      el.style.width = (data.width || 150) + 'px';
      el.style.height = (data.height || 150) + 'px';
      el.style.transform = `rotate(${data.rotation || 0}deg)`;
      el.style.zIndex = data.zIndex || 5;

      el.innerHTML = `
        <img src="${data.url}" alt="pic" draggable="false">
        <div class="pic-controls">
          <button class="front-btn">Front</button>
          <button class="back-btn">Back</button>
          <button class="del-btn">✕</button>
        </div>
        <div class="resize-handle"></div>
        <div class="rotate-handle"></div>
      `;

      layer.appendChild(el);
      makeInteractive(el);
    }

    function makeInteractive(el) {
      const id = el.dataset.id;
      let mode = null; // 'drag' | 'resize' | 'rotate'
      let startX, startY, startLeft, startTop, startW, startH, startRot, startAngle;

      function getAngle(x, y, cx, cy) {
        return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
      }

      function onStart(e, type) {
        if (!editMode) return;
        e.preventDefault();
        e.stopPropagation();
        mode = type;
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX;
        startY = touch.clientY;
        startLeft = parseFloat(el.style.left);
        startTop = parseFloat(el.style.top);
        startW = parseFloat(el.style.width);
        startH = parseFloat(el.style.height);
        startRot = pictures[id].rotation || 0;

        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        startAngle = getAngle(startX, startY, cx, cy) - startRot;

        el.style.cursor = type === 'drag' ? 'grabbing' : 'grabbing';
      }

      function onMove(e) {
        if (!mode || !editMode) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;

        if (mode === 'drag') {
          el.style.left = (startLeft + dx) + 'px';
          el.style.top = (startTop + dy) + 'px';
        } else if (mode === 'resize') {
          const newW = Math.max(40, startW + dx);
          const newH = Math.max(40, startH + dy);
          el.style.width = newW + 'px';
          el.style.height = newH + 'px';
        } else if (mode === 'rotate') {
          const rect = el.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const angle = getAngle(touch.clientX, touch.clientY, cx, cy) - startAngle;
          el.style.transform = `rotate(${angle}deg)`;
          pictures[id].rotation = angle;
        }
      }

      function onEnd() {
        if (!mode) return;
        pictures[id].x = parseFloat(el.style.left);
        pictures[id].y = parseFloat(el.style.top);
        pictures[id].width = parseFloat(el.style.width);
        pictures[id].height = parseFloat(el.style.height);
        pictures[id].rotation = pictures[id].rotation || 0;
        savePicture(id);
        mode = null;
        el.style.cursor = 'grab';
      }

      // Mouse
      el.addEventListener('mousedown', e => {
        if (e.target.classList.contains('resize-handle')) onStart(e, 'resize');
        else if (e.target.classList.contains('rotate-handle')) onStart(e, 'rotate');
        else if (!e.target.closest('.pic-controls')) onStart(e, 'drag');
      });
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      // Touch (basic + two-finger simple support can be extended)
      el.addEventListener('touchstart', e => {
        if (e.target.classList.contains('resize-handle')) onStart(e, 'resize');
        else if (e.target.classList.contains('rotate-handle')) onStart(e, 'rotate');
        else if (!e.target.closest('.pic-controls')) onStart(e, 'drag');
      }, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);

      // Buttons
      el.querySelector('.del-btn').onclick = () => {
        el.remove();
        delete pictures[id];
        db.ref('users/' + currentUid + '/pictures/' + id).remove();
      };
      el.querySelector('.front-btn').onclick = () => {
        const maxZ = Math.max(0, ...Object.values(pictures).map(p => p.zIndex || 5));
        pictures[id].zIndex = maxZ + 1;
        el.style.zIndex = pictures[id].zIndex;
        savePicture(id);
      };
      el.querySelector('.back-btn').onclick = () => {
        const minZ = Math.min(10, ...Object.values(pictures).map(p => p.zIndex || 5));
        pictures[id].zIndex = minZ - 1;
        el.style.zIndex = pictures[id].zIndex;
        savePicture(id);
      };
    }

    // Edit mode
    picBtn.onclick = () => {
      editMode = true;
      editBar.style.display = 'flex';
      document.querySelectorAll('.pic-item').forEach(el => el.classList.add('editing'));
    };

    document.getElementById('doneBtn').onclick = exitEditMode;

    function exitEditMode() {
      editMode = false;
      editBar.style.display = 'none';
      document.querySelectorAll('.pic-item').forEach(el => el.classList.remove('editing'));
    }

    document.getElementById('addPicBtn').onclick = () => {
      const url = document.getElementById('picUrl').value.trim();
      if (!url || !currentUid) return;

      const id = 'pic_' + Date.now();
      const data = {
        url,
        x: 80 + Math.random() * 100,
        y: 80 + Math.random() * 100,
        width: 160,
        height: 160,
        rotation: 0,
        zIndex: 10
      };
      pictures[id] = data;
      createPicElement(id, data);
      savePicture(id);
      document.getElementById('picUrl').value = '';
    };
  </script>
</body>
</html>
