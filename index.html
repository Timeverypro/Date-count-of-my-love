<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Time Counter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #12121a 0%, #050508 70%);
      color: #f0f0f5;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .timer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0;
      max-width: 96vw;
      padding: 0 12px;
      text-align: center;
      font-weight: 200;
      letter-spacing: 0.5px;
      line-height: 1.25;
      text-shadow: 0 0 18px rgba(120, 160, 255, 0.35),
                   0 0 40px rgba(80, 120, 255, 0.15);
      animation: softPulse 6s ease-in-out infinite;
    }

    .unit-block {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: 3.8em;
      padding: 0 0.55em;
    }

    .separator {
      width: 1.5px;
      height: 2.6em;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(160, 190, 255, 0.45) 20%,
        rgba(160, 190, 255, 0.45) 80%,
        transparent 100%
      );
      margin: 0 0.15em;
      align-self: center;
      opacity: 0.7;
    }

    .number {
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: #e8f0ff;
      font-size: clamp(42px, 11vw, 92px);
    }

    .label {
      font-size: clamp(11px, 2.8vw, 18px);
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-top: 0.15em;
    }

    /* Landscape */
    @media (orientation: landscape) {
      .number {
        font-size: clamp(36px, 8.5vw, 84px);
      }
      .label {
        font-size: clamp(10px, 2.2vw, 16px);
      }
      .separator {
        height: 2.3em;
      }
    }

    /* Portrait */
    @media (orientation: portrait) {
      .number {
        font-size: clamp(48px, 13vw, 96px);
      }
      .label {
        font-size: clamp(12px, 3.2vw, 18px);
      }
      .separator {
        height: 2.8em;
      }
    }

    /* Very narrow */
    @media (max-width: 380px) {
      .unit-block {
        min-width: 3.2em;
        padding: 0 0.4em;
      }
      .separator {
        height: 2.4em;
        margin: 0 0.05em;
      }
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.01); }
    }
  </style>
</head>
<body>
  <div class="timer" id="timer"></div>

  <script>
    // Fixed start: 22:45 on 1 May 2026 Thailand time (ICT = UTC+7)
    const START = new Date('2026-05-01T22:45:00+07:00').getTime();

    function plural(n, singular, plural) {
      return n === 1 ? singular : plural;
    }

    function update() {
      const now = Date.now();
      let diff = Math.max(0, now - START);

      const totalSeconds = Math.floor(diff / 1000);
      const days    = Math.floor(totalSeconds / 86400);
      const hours   = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('timer').innerHTML = `
        <div class="unit-block">
          <div class="number">${days}</div>
          <div class="label">${plural(days, 'day', 'days')}</div>
        </div>
        <div class="separator"></div>
        <div class="unit-block">
          <div class="number">${hours}</div>
          <div class="label">${plural(hours, 'hour', 'hours')}</div>
        </div>
        <div class="separator"></div>
        <div class="unit-block">
          <div class="number">${minutes}</div>
          <div class="label">${plural(minutes, 'minute', 'minutes')}</div>
        </div>
        <div class="separator"></div>
        <div class="unit-block">
          <div class="number">${seconds}</div>
          <div class="label">${plural(seconds, 'second', 'seconds')}</div>
        </div>
      `;
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
